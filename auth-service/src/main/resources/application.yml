server:
  port: 8083

spring:
  application:
    name: auth-service

keycloak:
  base-url: http://keycloak:8080
  realm: loyalty-realm
  admin-client-id: loyalty-app
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:loyalty-app-dev-secret}
  login-client-id: loyalty-app
  login-client-secret: ${KEYCLOAK_LOGIN_CLIENT_SECRET:loyalty-app-dev-secret}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
