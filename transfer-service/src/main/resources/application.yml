server:
  port: 8082

spring:
  application:
    name: transfer-service
  data:
    mongodb:
      uri: mongodb://mongo:27017/transfer_service?replicaSet=rs0
  kafka:
    bootstrap-servers: kafka:9092
    security:
      protocol: SASL_PLAINTEXT
    properties:
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="transfer-service" password="${KAFKA_TRANSFER_SERVICE_PASSWORD:transfer-service-secret}";
    consumer:
      group-id: transfer-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.loyalty.*"
        spring.json.use.type.headers: true
        spring.json.type.mapping: "debitResult:com.loyalty.transfer.saga.events.DebitResultEvent,creditResult:com.loyalty.transfer.saga.events.CreditResultEvent,compensationResult:com.loyalty.transfer.saga.events.CompensationResultEvent,debitRequested:com.loyalty.transfer.saga.events.DebitRequestedEvent,creditRequested:com.loyalty.transfer.saga.events.CreditRequestedEvent,compensateDebit:com.loyalty.transfer.saga.events.CompensateDebitEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: "debitRequested:com.loyalty.transfer.saga.events.DebitRequestedEvent,creditRequested:com.loyalty.transfer.saga.events.CreditRequestedEvent,compensateDebit:com.loyalty.transfer.saga.events.CompensateDebitEvent"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/loyalty-realm

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

transfer:
  saga:
    timeout-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

