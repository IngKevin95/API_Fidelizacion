spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:18191
          predicates:
            - Path=/auth/**
        - id: account-service
          uri: http://localhost:18192
          predicates:
            - Path=/accounts/**
        - id: transfer-service
          uri: http://localhost:18193
          predicates:
            - Path=/api/v1/points/**
